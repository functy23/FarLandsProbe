plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Distinct artifact name so both version jars can coexist: farlandsprobe-26.2-<version>.jar
base {
	archivesName = "farlandsprobe-26.2"
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
}

loom {
	accessWidenerPath = file("src/main/resources/farlandsprobe.accesswidener")

	runs {
		client {
			// far-lands exploration generates huge amounts of terrain; give the game headroom.
			vmArgs "-Xmx8G"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Cloth Config is required (config screens + config file).
	implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
	// Mod Menu is optional at runtime; only used for the config screen entry point.
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"

	// Unit tests for the Minecraft-free helpers (SectionEncoding / OverflowSafeMath).
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
}
